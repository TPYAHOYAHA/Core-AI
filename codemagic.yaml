workflows:
  export-yolo26-coreai:
    name: Export YOLO26 to Apple Core AI
    instance_type: mac_mini_m2
    max_build_duration: 30

    inputs:
      model_path:
        description: "リポジトリ内の学習済み .pt のパス"
        type: string
        default: "best.pt"

    environment:
      xcode: "27.1"
      vars:
        MODEL_PATH: ${{ inputs.model_path }}

    scripts:
      - name: Fetch Git LFS files
        script: |
          set -euo pipefail
          git lfs install --local --skip-smudge
          git lfs pull

      - name: Export NMS-free Core AI model
        script: |
          set -euo pipefail
          test -f "$MODEL_PATH" || {
            echo "モデルが見つかりません: $MODEL_PATH" >&2
            exit 1
          }

          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh |
              env UV_UNMANAGED_INSTALL="$HOME/.local/bin" sh
            export PATH="$HOME/.local/bin:$PATH"
          fi

          mkdir -p artifacts

          uv run --no-project --python 3.11 --prerelease allow \
            --with ultralytics --with coreai-torch --with 'torch==2.13.0' python - <<'PY'
          import os

          import torch
          from coreai_torch import TorchConverter, get_decomp_table
          from ultralytics import YOLO

          yolo = YOLO(os.environ["MODEL_PATH"])
          model = yolo.model.cpu().float().eval()
          head = model.model[-1]

          if yolo.task != "detect" or head.nc != 6:
              raise ValueError("硬貨6クラスで学習した物体検出モデルを指定してください。")
          if any(
              getattr(head, branch, None) is None
              for branch in ("one2one_cv2", "one2one_cv3")
          ):
              raise ValueError("指定した .pt に one-to-one 検出ヘッドがありません。")
          head.end2end = True
          if not head.end2end:
              raise ValueError("one-to-one 推論を有効にできませんでした。")

          # 推論結果のテンソルだけを返す。NMSは追加しない。
          head.export = True
          head.format = "onnx"

          image = torch.zeros((1, 3, 640, 640), dtype=torch.float32)
          with torch.no_grad():
              detections = model(image)

          if (
              not isinstance(detections, torch.Tensor)
              or detections.ndim != 3
              or detections.shape[0] != 1
              or detections.shape[-1] != 6
          ):
              raise ValueError("期待する検出出力は [1, N, 6] です。")
          print("PyTorch output shape:", tuple(detections.shape))

          def decompose_scalar_remainder(indices, divisor):
              # YOLO uses this remainder to recover class IDs from TopK indices.
              quotient = torch.floor_divide(indices, divisor)
              return indices - quotient * divisor

          exported = torch.export.export(model, args=(image,))
          decompositions = get_decomp_table()
          remainder = torch.ops.aten.remainder.Scalar
          decompositions[remainder] = decompose_scalar_remainder
          exported = exported.run_decompositions(decompositions)
          if any(node.target == remainder for node in exported.graph.nodes):
              raise RuntimeError("aten.remainder.Scalar remains in the Core AI export graph.")
          with torch.no_grad():
              torch.testing.assert_close(exported.module()(image), detections)

          program = (
              TorchConverter()
              .add_exported_program(
                  exported,
                  input_names=["image"],
                  output_names=["detections"],
              )
              .to_coreai()
          )
          program.save_asset("artifacts/best.aimodel")
          PY

          test -f artifacts/best.aimodel
          test -s artifacts/best.aimodel

    artifacts:
      - artifacts/best.aimodel
